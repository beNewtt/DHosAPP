<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dental Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a2a6e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dental Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="hd">
  <div class="brand"><div class="ic">DT</div>
    <div><h1>DENTAL TRACKER</h1><p>ระบบนัดหมายและประวัติคนไข้ทันตกรรม</p></div></div>
  <nav id="nav">
    <button data-act="nav" data-v="schedule" class="on">Calendar</button>
    <button data-act="nav" data-v="planner">Planner</button>
    <button data-act="nav" data-v="more">More</button>
    <button data-act="nav" data-v="archive" title="ทะเบียนคนไข้ / ค้นหาคนไข้" aria-label="ทะเบียนคนไข้"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-2px"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button>
  </nav>
  <div class="hright">
    <span id="syncBadge"><b></b>เครื่องนี้</span>
    <button class="ico" data-act="nav" data-v="settings" aria-label="ตั้งค่า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</div></header>
<div class="tpanel" id="tpanel"></div>
<div class="app" id="app"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<div id="pwaBar"><span id="pwaMsg"></span><button id="pwaBtn">ตกลง</button><button id="pwaX">✕</button></div>

<!-- โหลดตามลำดับนี้เท่านั้น ห้ามสลับ -->
<script src="js/config.js"></script>
<script src="js/themes.js"></script>
<script src="js/data.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
