<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dental Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a2a6e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dental Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#fff;--surface:#fff;--soft:#f5f7fb;--line:#e6e8f0;--line2:#f0f1f7;
  --ink:#2a2a6e;--ink2:#8a8fa8;--tx:#1f2140;--tx2:#8a8fa8;--hl:#2a2a6e;--onhl:#fff;
  --am:#d99206;--pm:#6b6ec9;--ev:#8b5cf6;
  --dngBg:#fdecee;--dngLn:#f6d2d8;--dng:#c2344a;--okBg:#e8f6ee;--okLn:#c9e9d8;--ok:#0f7a4c;
  --wrnBg:#fffaed;--wrnLn:#f0e3bd;--wrn:#8a6410;--infBg:#eef0fb;--infLn:#d8dcf3;--inf:#2a2a6e;--r:2px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:13.5px;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
button{cursor:pointer;border:0;background:none}
.mono{font-family:'IBM Plex Mono',monospace}
.app{max-width:1240px;margin:0 auto;padding:0 clamp(12px,2vw,28px) 90px}
header{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
.hd{max-width:1240px;margin:0 auto;padding:12px clamp(12px,2vw,28px);display:flex;align-items:center;gap:clamp(8px,1.4vw,18px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .ic{width:40px;height:40px;background:var(--hl);color:var(--onhl);display:grid;place-items:center;font-weight:800;font-size:15px;border-radius:var(--r)}
.brand h1{font-size:clamp(15px,1.5vw,19px);font-weight:800;color:var(--ink);line-height:1.15}
.brand p{font-size:10.5px;color:var(--tx2);font-weight:500}
nav{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
nav button{padding:9px clamp(10px,1.3vw,20px);color:var(--tx2);font-weight:600;border-right:1px solid var(--line);white-space:nowrap}
nav button:last-child{border-right:0}
nav button.on{background:var(--hl);color:var(--onhl)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;flex:1;max-width:260px;min-width:140px;background:var(--soft)}
.search input{background:none;border:0;outline:none;width:100%}
.ico{width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r);color:var(--ink);display:grid;place-items:center;background:var(--soft);font-size:15px}
#syncBadge{font-size:11px;font-weight:700;white-space:nowrap;color:var(--tx2)}
.tpanel{position:fixed;top:64px;right:clamp(10px,2vw,26px);width:300px;max-height:78vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.3);padding:14px;z-index:50;display:none}
.tpanel.on{display:block}
.tpanel .lb{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin:10px 0 8px}
.th{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:4px;margin-bottom:5px;background:var(--soft);border:1px solid transparent;font-weight:700;font-size:12.5px;width:100%;color:var(--tx)}
.th:hover{border-color:var(--line)}.th.on{border-color:var(--hl);color:var(--ink)}
.th .sws{margin-left:auto;display:flex;gap:4px}
.th .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.hr{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
h2{font-size:clamp(16px,1.8vw,19px);font-weight:800;color:var(--ink);margin:22px 0 13px}
h3{font-size:11.5px;color:var(--tx2);margin:18px 0 8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.btn{background:var(--surface);border:1px solid var(--line);padding:9px 15px;border-radius:var(--r);font-weight:600;color:var(--tx)}
.btn:hover{border-color:var(--hl);color:var(--ink)}
.btn.pri{background:var(--hl);border-color:var(--hl);color:var(--onhl)}
.btn.pri:hover{filter:brightness(1.12);color:var(--onhl)}
.btn.sm{padding:6px 11px;font-size:12px}.btn.dg{color:var(--dng)}.btn.dg:hover{border-color:var(--dng)}
.btn.blk{width:100%;justify-content:center;display:flex}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r);font-size:10.5px;font-weight:700;border:1px solid}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.sq{width:9px;height:9px;display:inline-block;flex:0 0 9px}
.muted{color:var(--tx2)}
.empty{color:var(--tx2);text-align:center;padding:40px;border:1px dashed var(--line);border-radius:var(--r);background:var(--soft)}
.note{background:var(--wrnBg);border:1px solid var(--wrnLn);color:var(--wrn);padding:8px 11px;border-radius:var(--r);font-size:12px;font-weight:600}
.warn{background:var(--dngBg);border:1px solid var(--dngLn);color:var(--dng);padding:8px 11px;font-size:12px;font-weight:600;border-radius:var(--r);margin-bottom:10px}
.ok{background:var(--okBg);border:1px solid var(--okLn);color:var(--ok);padding:8px 11px;font-size:12px;font-weight:600;border-radius:var(--r)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:clamp(14px,2.6vw,34px) 0 clamp(12px,1.8vw,22px);gap:16px;flex-wrap:wrap}
.hero .num{font-size:clamp(48px,8vw,96px);font-weight:700;line-height:.85;color:transparent;-webkit-text-stroke:2.2px var(--ink)}
.hero .rt{text-align:right;margin-left:auto}
.hero .mn{font-size:clamp(22px,3.4vw,40px);font-weight:800;color:var(--ink);line-height:1}
.hero .yr{font-size:clamp(14px,1.6vw,19px);font-weight:700;color:var(--pm);margin-top:2px}
.nav2{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.nav2 button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;color:var(--ink);display:grid;place-items:center}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{padding:8px 14px;color:var(--tx2);font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--hl);color:var(--onhl)}
.cal{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.gh{padding:clamp(7px,.9vw,11px) 0;text-align:center;font-size:clamp(10.5px,1vw,12px);font-weight:700;color:var(--ink);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{position:relative;min-height:clamp(62px,8.4vw,112px);padding:clamp(5px,.7vw,9px) clamp(6px,.8vw,10px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;overflow:hidden}
.cell:hover{background:var(--soft)}
.cell.out{background:var(--soft);opacity:.5}
.cell.tdy{background:var(--hl)}.cell.tdy .cn,.cell.tdy .rl,.cell.tdy .cnt{color:var(--onhl)!important}
.cell.mark{box-shadow:inset 0 0 0 2px var(--mk)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between}
.cn{font-size:clamp(12px,1.25vw,16px);font-weight:700;color:var(--ink);margin-left:auto}
.cn.sun{color:var(--dng)}
.rl{font-size:clamp(9px,.85vw,10.5px);font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbot{margin-top:auto;display:flex;align-items:center;gap:6px}
.cbot u{flex:1;height:4px;background:var(--line2);text-decoration:none;display:block}
.cbot u b{display:block;height:100%}
.cnt{font-size:clamp(9px,.85vw,11px);font-weight:700;color:var(--ink);white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.fl{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:600;font-size:12px;color:var(--tx)}
.fl.on{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
@media(max-width:1024px){.rl.sub{display:none}}
@media(max-width:760px){.cbot u{display:none}}
.plan{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
.plab{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pm)}
.ptitle{font-size:clamp(22px,3vw,34px);font-weight:700;color:var(--ink);letter-spacing:-.5px}
.side{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);position:sticky;top:78px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);border-radius:var(--r);font-weight:700;font-size:12px;color:var(--tx);background:var(--soft)}
.tabs button.on{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
.dows{display:flex;gap:5px;flex-wrap:wrap}
.dows button{flex:1;min-width:34px;padding:7px 0;border:1px solid var(--line);border-radius:var(--r);font-size:11.5px;font-weight:700;color:var(--tx);background:var(--surface)}
.dows button.on{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
.cell.pk{box-shadow:inset 0 0 0 2px var(--pm);background:var(--soft)}
@media(max-width:900px){.plan{grid-template-columns:1fr}.side{position:static}}
.day{display:flex;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:var(--surface)}
.rail{width:clamp(84px,10vw,120px);flex:0 0 auto;border-right:1px solid var(--line);padding:12px 10px;text-align:center;background:var(--soft)}
.rail .dw{font-size:11px;color:var(--tx2);font-weight:700}
.rail .dn{font-size:clamp(24px,3vw,34px);font-weight:800;color:var(--ink);line-height:1.05}
.rail .dm{font-size:10.5px;color:var(--tx2);margin-bottom:8px}
.rail.today{background:var(--hl)}.rail.today .dw,.rail.today .dn,.rail.today .dm{color:var(--onhl)}
.rail.today .btn{background:transparent;color:var(--onhl);border-color:rgba(255,255,255,.4)}
.rl2{font-size:11px;font-weight:700;padding:4px 6px;border-radius:var(--r);display:block;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);font-weight:600}
.slot{border:1px solid var(--line);border-left:3px solid;border-radius:var(--r);padding:10px 12px}
.slot.am{border-left-color:var(--am)}.slot.pm{border-left-color:var(--pm)}.slot.ev{border-left-color:var(--ev)}
.slot h4{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--tx)}
.pt{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line2);border-radius:var(--r);margin-top:8px;background:var(--surface)}
.pt .nm{font-weight:700}.pt .hn{font-size:11.5px;color:var(--tx2);margin-top:2px}
.pt .ac{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:42px;height:38px;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;background:var(--soft);color:var(--ink);border:1px solid var(--line);flex:0 0 42px;line-height:1.1}
.st{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:var(--r);border:1px solid}
.st.scheduled{background:var(--infBg);color:var(--inf);border-color:var(--infLn)}
.st.done{background:var(--okBg);color:var(--ok);border-color:var(--okLn)}
.st.cancelled{background:var(--dngBg);color:var(--dng);border-color:var(--dngLn)}
.st.noshow{background:var(--wrnBg);color:var(--wrn);border-color:var(--wrnLn)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line2)}
th{color:var(--tx2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
tr.sel td{background:var(--soft);box-shadow:inset 3px 0 0 var(--hl)}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.tl{border-left:1px solid var(--line);padding-left:16px;margin-left:5px}
.tl .it{position:relative;margin-bottom:14px}
.tl .it:before{content:'';position:absolute;left:-20px;top:6px;width:9px;height:9px;background:var(--hl);box-shadow:0 0 0 3px var(--surface)}
.mask{position:fixed;inset:0;background:rgba(10,10,20,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:36px 14px;overflow:auto}
.mask.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:560px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mtitle{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:3px}
.f{margin-bottom:12px}
.f label{display:block;font-size:11px;color:var(--tx2);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--hl)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.g3,.g2{grid-template-columns:1fr}}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:9px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:12.5px}
.pick label.on{border-color:var(--hl);background:var(--soft);color:var(--ink)}
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 3px);background:var(--surface);border:1px solid var(--line);max-height:240px;overflow:auto;z-index:5;display:none;box-shadow:0 12px 26px rgba(0,0,0,.2)}
.ac-list .opt{padding:9px 11px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2)}
.ac-list .opt:hover{background:var(--soft)}.ac-list .opt.dis{opacity:.45;cursor:not-allowed}
.ac-list .opt.new{color:var(--ink);font-weight:700;background:var(--soft)}
.ac-list .opt b{font-size:13px}.ac-list .opt small{color:var(--tx2);display:block;font-size:11px}
.ac-list .tag{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--dng);border:1px solid var(--dngLn);background:var(--dngBg);padding:2px 7px}
#pwaBar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:99;background:var(--hl);color:var(--onhl);padding:11px 14px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.35);align-items:center;gap:12px;font-weight:600;font-size:13px;max-width:92vw}
#pwaBar.on{display:flex}
#pwaBtn{background:var(--onhl);color:var(--hl);padding:6px 13px;border-radius:2px;font-weight:700}
#pwaX{color:var(--onhl);opacity:.7;font-size:16px}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand"><div class="ic">DT</div>
    <div><h1>DENTAL TRACKER</h1><p>ระบบนัดหมายและประวัติคนไข้ทันตกรรม</p></div></div>
  <nav id="nav">
    <button data-act="nav" data-v="schedule" class="on">ปฏิทิน</button>
    <button data-act="nav" data-v="planner">วางแผน</button>
    <button data-act="nav" data-v="upcoming">นัดที่จะถึง</button>
    <button data-act="nav" data-v="archive">ทะเบียนคนไข้</button>
    <button data-act="nav" data-v="settings">ตั้งค่า</button>
  </nav>
  <div class="search">🔍<input id="q" placeholder="ค้นหา HN / ชื่อ / เบอร์โทร"/></div>
  <span id="syncBadge">● เครื่องนี้</span>
  <button class="ico" data-act="themeBtn">⚙</button>
</div></header>
<div class="tpanel" id="tpanel"></div>
<div class="app" id="app"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<div id="pwaBar"><span id="pwaMsg"></span><button id="pwaBtn">ตกลง</button><button id="pwaX">✕</button></div>

<script>
/* ==================================================================
   ⚙️ CONFIG — ใส่คีย์ Supabase (เว้นว่าง = โหมดเครื่องเดียว)
   ================================================================== */
const SUPA_URL = '';
const SUPA_KEY = '';
const ROW_ID   = 'clinic-main';
/* ================================================================== */

/* ---------- THEME ENGINE ---------- */
const hx=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const lum=h=>{const[r,g,b]=hx(h);return (.299*r+.587*g+.114*b)/255};
const rgba=(h,a)=>{const[r,g,b]=hx(h);return `rgba(${r},${g},${b},${a})`};
const mixc=(a,b,t)=>{const A=hx(a),B=hx(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const onC=h=>lum(h)>.62?'#141414':'#ffffff';
function T(id,name,c){
  const dark=lum(c.bg)<.5;
  const okc=dark?'#34d399':'#0f7a4c', wrc=dark?'#fbbf24':'#8a6410';
  return {id,name,dark,sw:[c.accent,c.secondary,c.bg],v:{
    bg:c.bg, surface:c.surface, soft:c.surface2,
    line:c.border, line2:mixc(c.border,c.surface,.55),
    ink:c.accent, ink2:c.subtext, tx:c.text, tx2:c.subtext,
    hl:c.accent, onhl:onC(c.accent),
    am:dark?'#fbbf24':'#d99206', pm:c.secondary, ev:c.accentHover,
    dngBg:rgba(c.danger,dark?.20:.12), dngLn:rgba(c.danger,.45), dng:c.danger,
    okBg:rgba(okc,dark?.18:.14), okLn:rgba(okc,.40), ok:okc,
    wrnBg:rgba(wrc,dark?.18:.16), wrnLn:rgba(wrc,.40), wrn:wrc,
    infBg:rgba(c.accent,dark?.20:.13), infLn:rgba(c.accent,.40), inf:c.accent}};
}
const THEMES=[
 T('light','Daylight',{bg:'#FFFFFF',surface:'#FFFFFF',surface2:'#F5F7FB',text:'#1F2140',subtext:'#8A8FA8',accent:'#2A2A6E',accentHover:'#1E1E55',secondary:'#6B6EC9',border:'#E6E8F0',danger:'#C2344A'}),
 T('sakura','Sakura',{bg:'#FFFAFC',surface:'#FFFFFF',surface2:'#FDF1F5',text:'#3F2230',subtext:'#A67C8C',accent:'#D6336C',accentHover:'#A61E4D',secondary:'#E0568E',border:'#F5DDE5',danger:'#C2185B'}),
 T('iceberg','Iceberg',{bg:'#E8EAF0',surface:'#D5DAE6',surface2:'#C3CADB',text:'#1F365C',subtext:'#6E7F9E',accent:'#2F5DAA',accentHover:'#264C8C',secondary:'#A7B1CA',border:'#CBD1DD',danger:'#B75A68'}),

const KEY='dental_tracker_v5';
const SESSIONS=[{id:'am',name:'เช้า',time:'09:00–12:00',c:'var(--am)'},{id:'pm',name:'บ่าย',time:'13:00–16:00',c:'var(--pm)'},{id:'ev',name:'เย็น',time:'16:00–20:00',c:'var(--ev)'}];
const DEF_WT=[
 {id:'fung',name:'ฟุ้ง',short:'ฟุ้ง',room:'ฟุ้ง',color:'#e0a30b',group:'ฟุ้ง'},
 {id:'pks',name:'ปกส',short:'ปกส',room:'ปกส',color:'#c07f06',group:'ปกส / 1-1'},
 {id:'r11',name:'1/1',short:'1/1',room:'1/1',color:'#8a5cf6',group:'ปกส / 1-1'},
 {id:'scr',name:'Screen',short:'SCR',room:'Screen',color:'#e5115f',group:'Screen / รพ.สต.'},
 {id:'rpst',name:'รพ.สต.',short:'สต.',room:'รพ.สต.',color:'#0f9b8e',group:'Screen / รพ.สต.'},
 {id:'dm',name:'DM',short:'DM',room:'DM',color:'#3d3f92',group:'DM'},
 {id:'off',name:'OFF (วันหยุด)',short:'OFF',room:'วันหยุด',color:'#9aa0b5',group:'OFF'}];
const PROCS=['ตรวจ / ปรึกษา','ขูดหินปูน','อุดฟัน','ถอนฟัน','ผ่าฟันคุด','รักษารากฟัน','Insert RPD','Insert TP','Try in framework','Try in teeth','Border molding','Final impression','Recheck','Reline','Stitch off','F/U','X-ray'];
const uid=p=>p+Math.random().toString(36).slice(2,9);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'],DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสฯ','ศุกร์','เสาร์'];
const thDate=s=>{const d=parseD(s);return `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear()+543}`};
const TODAY=iso(new Date());
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const digits=s=>(s||'').replace(/\D/g,'');
const ses4=t=>{const h=+(t||'13:00').split(':')[0];return h<12?'am':h<16?'pm':'ev'};

let DB=loadLocal();
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.patients)return r}catch(e){}return seed()}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('พื้นที่เก็บข้อมูลเต็ม — สำรองแล้วลบข้อมูลเก่า')}}
function save(){localSave();autoBackup();if(SYNC.on)queuePush()}
const wt=id=>DB.workTypes.find(w=>w.id===id)||DB.workTypes[0];
const pt=id=>DB.patients.find(p=>p.id===id);
const daySch=d=>DB.daySchedules[d]||null;
const isOff=d=>{const s=daySch(d);return !!s&&s.typeId==='off'};
function seed(){
  const db={patients:[],appointments:[],visits:[],daySchedules:{},workTypes:DEF_WT.slice(),
    categories:['Oral exam','RPD','TP','CD','ENDO','SUR','Stitch off','F/U','อื่นๆ'],
    categoryStyles:{'Oral exam':{bg:'#EDEAE0',text:'#5C6D68'},'RPD':{bg:'#EFE1EA',text:'#63405A'},
      'TP':{bg:'#EFE1EA',text:'#63405A'},'CD':{bg:'#EFE1EA',text:'#63405A'},'ENDO':{bg:'#F7E4DD',text:'#9C4530'},
      'SUR':{bg:'#FBDADA',text:'#A33636'},'Stitch off':{bg:'#FBDADA',text:'#A33636'},
      'F/U':{bg:'#E3E7F3',text:'#3C4A75'},'อื่นๆ':{bg:'#F0EBDD',text:'#8A7F63'}},theme:'light'};
  localStorage.setItem(KEY,JSON.stringify(db));return db;
}
/* ---------- AUTO BACKUP ---------- */
const BK='dental_backup_';
function autoBackup(){const k=BK+TODAY;
  try{localStorage.setItem(k,JSON.stringify({at:new Date().toISOString(),data:DB}));
    const keys=Object.keys(localStorage).filter(x=>x.startsWith(BK)).sort();
    while(keys.length>7)localStorage.removeItem(keys.shift())}catch(e){}}
const backupList=()=>Object.keys(localStorage).filter(x=>x.startsWith(BK)).sort().reverse();
function restoreBackup(k){try{const j=JSON.parse(localStorage.getItem(k));
  if(!j?.data?.patients)throw 0;DB=j.data;localSave();applyTheme(DB.theme);render();
  alert('กู้คืนข้อมูลวันที่ '+k.replace(BK,'')+' เรียบร้อย')}catch(e){alert('ไฟล์สำรองเสียหาย')}}

/* ---------- STATE ---------- */
const now=new Date();
let S={view:'schedule',mode:'cal',cur:new Date(now.getFullYear(),now.getMonth(),1),q:'',sel:null,onlyBusy:true,filter:'all',
  plan:{sel:new Set(),mode:'room',typeId:DEF_WT[0].id,session:'am',note:'',dows:new Set(),every:'all'}};
function applyTheme(id){const t=THEMES.find(x=>x.id===id)||THEMES[0];
  Object.entries(t.v).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t.v.hl);
  DB.theme=t.id;localSave()}
applyTheme(DB.theme||'light');

/* ---------- QUERIES ---------- */
const apptsOn=d=>DB.appointments.filter(a=>a.date===d).sort((x,y)=>(x.time||'99:99').localeCompare(y.time||'99:99'));
const match=(p,q)=>!q||(p.hn+' '+p.name+' '+(p.cat||'')+' '+(p.tags||[]).join(' ')+' '+(p.phone||'')+' '+digits(p.phone)).toLowerCase().includes(q.toLowerCase());
const filterAppts=l=>!S.q?l:l.filter(a=>{const p=pt(a.patientId);return p&&match(p,S.q)});
const initials=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('');
const busyOn=(date,ex)=>new Set(DB.appointments.filter(a=>a.date===date&&a.status!=='cancelled'&&a.id!==ex).map(a=>a.patientId));
function dupPatients(){const g={},out=[];
  DB.patients.forEach(p=>{const k1='hn:'+(p.hn||'').trim().toLowerCase(),k2='ph:'+digits(p.phone);
    if(p.hn)(g[k1]=g[k1]||[]).push(p);if(digits(p.phone).length>=9)(g[k2]=g[k2]||[]).push(p)});
  Object.entries(g).forEach(([k,v])=>{if(v.length>1)out.push({k,v})});return out}
const catChip=c=>{const cs=(DB.categoryStyles||{})[c];
  return c?`<span class="chip" style="border-color:${cs?cs.bg:'var(--line)'};color:${cs?cs.text:'var(--tx2)'};background:${cs?cs.bg:'transparent'}">${esc(c)}</span>`:''};

/* ---------- RENDER ---------- */
const app=document.getElementById('app'),$=x=>document.getElementById(x);
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  app.innerHTML=S.view==='schedule'?vSchedule():S.view==='planner'?vPlanner():S.view==='upcoming'?vUpcoming():S.view==='archive'?vArchive():vSettings();
}
function vSchedule(){const y=S.cur.getFullYear(),m=S.cur.getMonth();
  return `<div class="hero"><div class="num mono">${String(m+1).padStart(2,'0')}</div>
    <div class="rt"><div class="mn">${TH_MF[m]}</div><div class="yr">${y+543}</div>
    <div class="nav2"><button data-act="mv" data-n="-1">‹</button><button data-act="mv" data-n="1">›</button></div></div></div>
  <div class="tools"><div class="seg">
    <button data-act="mode" data-m="cal" class="${S.mode==='cal'?'on':''}">ภาพรวม</button>
    <button data-act="mode" data-m="list" class="${S.mode==='list'?'on':''}">รายวัน</button></div>
    <button class="btn sm" data-act="today">📍 วันนี้</button>
    <button class="btn pri sm" style="margin-left:auto" data-act="addAppt" data-d="${TODAY}">＋ เพิ่มนัดคนไข้</button></div>`
  +(S.mode==='cal'?calendar(y,m):dayList(y,m))}
function calendar(y,m){
  const start=new Date(y,m,1-new Date(y,m,1).getDay());let max=1;
  for(let i=0;i<42;i++){const k=iso(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));max=Math.max(max,apptsOn(k).length)}
  let cells='';
  for(let i=0;i<42;i++){
    const dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(dt);
    const out=dt.getMonth()!==m,s=daySch(k),w=s?wt(s.typeId):null;
    if(S.filter!=='all'&&(!w||w.id!==S.filter)){cells+=`<button class="cell ${out?'out':''}" data-act="openDay" data-d="${k}" style="opacity:.3"><div class="ctop"><span class="cn ${dt.getDay()===0?'sun':''}">${dt.getDate()}</span></div></button>`;continue}
    const n=apptsOn(k).length,tdy=k===TODAY,mk=w&&(w.id==='off'||w.id==='scr');
    cells+=`<button class="cell ${out?'out':''} ${tdy?'tdy':''} ${mk&&!tdy?'mark':''}" ${mk?`style="--mk:${w.color}"`:''} data-act="openDay" data-d="${k}">
      <div class="ctop">${w?`<i class="sq" style="background:${w.color}"></i>`:'<i></i>'}<span class="cn ${dt.getDay()===0?'sun':''}">${dt.getDate()}</span></div>
      ${w?`<div class="rl" style="color:${tdy?'var(--onhl)':w.color}">${esc(s.room||w.room)}</div>`:''}
      ${s&&s.note?`<div class="rl sub" style="color:var(--tx2);font-weight:500">${esc(s.note)}</div>`:''}
      <div class="cbot">${n?`<u><b style="width:${Math.round(n/max*100)}%;background:${tdy?'var(--onhl)':(w?w.color:'var(--hl)')}"></b></u><span class="cnt">${n} คน</span>`:''}</div></button>`}
  return `<div class="cal"><div class="grid">${DOW.map(d=>`<div class="gh">${d}</div>`).join('')}</div><div class="grid">${cells}</div></div>
    <div class="filters"><button class="fl ${S.filter==='all'?'on':''}" data-act="filt" data-f="all">ทั้งหมด</button>
    ${DB.workTypes.map(w=>`<button class="fl ${S.filter===w.id?'on':''}" data-act="filt" data-f="${w.id}"><i class="dot" style="background:${w.color}"></i>${esc(w.name)}</button>`).join('')}</div>`}
function dayList(y,m){
  const last=new Date(y,m+1,0).getDate();let out='',any=false;
  out+=`<div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap">
    <div class="seg"><button data-act="busy" data-v="1" class="${S.onlyBusy?'on':''}">เฉพาะวันที่มีนัด</button>
    <button data-act="busy" data-v="0" class="${!S.onlyBusy?'on':''}">ทุกวันที่มีงาน</button></div>
    ${S.q?`<span class="chip" style="border-color:var(--line);color:var(--tx2)">กรอง “${esc(S.q)}”</span>`:''}</div>`;
  for(let i=1;i<=last;i++){
    const k=iso(new Date(y,m,i)),s=daySch(k),ap=filterAppts(apptsOn(k));
    if(S.onlyBusy&&!ap.length)continue;
    if(!S.onlyBusy&&!s&&!ap.length)continue;
    any=true;
    const dt=parseD(k),w=s?wt(s.typeId):null,off=s&&s.typeId==='off';
    const shown=SESSIONS.filter(se=>ap.some(a=>a.session===se.id));
    out+=`<div class="day" id="d-${k}">
      <div class="rail ${k===TODAY?'today':''}">
        <div class="dw">${DOWF[dt.getDay()]}</div><div class="dn">${i}</div><div class="dm">${TH_M[m]} ${y+543}</div>
        ${w?`<span class="rl2" style="background:${w.color}22;color:${w.color};border:1px solid ${w.color}55">${esc(s.room||w.room)}</span>`
           :`<span class="rl2" style="background:var(--soft);color:var(--tx2)">ยังไม่ตั้งห้อง</span>`}
        <button class="btn sm blk" data-act="daySet" data-d="${k}">ตั้งค่าห้อง</button></div>
      <div class="slots">
        ${s&&s.note?`<div class="note">📌 ${esc(s.note)}</div>`:''}
        ${off?`<div class="slot" style="border-left-color:#9aa0b5"><h4>🚫 วันหยุด (OFF)</h4></div>`:''}
        ${shown.map(se=>{const l=ap.filter(a=>a.session===se.id);
          return `<div class="slot ${se.id}"><div class="row sp">
            <h4><i class="dot" style="background:${se.c}"></i> ${se.name}<span class="muted">· ${l.length} คน</span></h4>
            <button class="btn sm" data-act="addAppt" data-d="${k}" data-s="${se.id}">＋ เพิ่ม</button></div>
            ${l.map(ptRow).join('')}</div>`}).join('')}
        <div class="addrow">＋ เพิ่มนัด:
          ${SESSIONS.map(se=>`<button class="btn sm" data-act="addAppt" data-d="${k}" data-s="${se.id}">${se.name}</button>`).join('')}</div>
      </div></div>`}
  return out+(any?'':`<div class="empty">ไม่มีนัดในเดือนนี้</div>`)}
function ptRow(a){
  const p=pt(a.patientId);if(!p)return'';
  const al=(p.tags||[]).length?`<span class="chip" style="border-color:var(--dngLn);color:var(--dng);background:var(--dngBg)">⚠ ${esc(p.tags[0])}</span>`:'';
  return `<div class="pt">
    <div class="avatar">${a.time?`<b style="font-size:11.5px">${esc(a.time)}</b><small style="font-size:8.5px;opacity:.7">${a.duration||30} น.</small>`:esc(initials(p.name))}</div>
    <div style="min-width:0"><div class="nm">${esc(p.name)} ${catChip(p.cat)} ${al}</div>
    <div class="hn">${esc(p.hn||'ไม่มี HN')}${p.phone?' · '+esc(p.phone):''} · 🦷 ${esc(a.proc||'ไม่ระบุ')}${a.tooth?' · ซี่ '+esc(a.tooth):''}</div></div>
    <div class="ac"><span class="st ${a.status}">${({scheduled:'นัดไว้',done:'มาแล้ว',cancelled:'ยกเลิก',noshow:'ไม่มา'})[a.status]}</span>
    <button class="btn sm" data-act="editAppt" data-id="${a.id}">แก้ไข</button>
    <button class="btn sm dg" data-act="delAppt" data-id="${a.id}">ลบ</button></div></div>`}
function vPlanner(){
  const y=S.cur.getFullYear(),m=S.cur.getMonth(),P=S.plan;
  const start=new Date(y,m,1-new Date(y,m,1).getDay());let cells='';
  for(let i=0;i<42;i++){const dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(dt),out=dt.getMonth()!==m;
    const s=daySch(k),w=s?wt(s.typeId):null;

    box.innerHTML=list.map(p=>{const b=busy.has(p.id);
      return `<div class="opt ${b?'dis':''}" data-p="${p.id}" data-b="${b?1:0}">
      <div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.hn||'ไม่มี HN')} · ${esc(p.phone||'-')} · ${esc(p.cat||'')}</small></div>
      ${b?'<span class="tag">มีนัดวันนี้แล้ว</span>':''}</div>`}).join('')
      +`<div class="opt new" data-p="__new">＋ สร้างคนไข้ใหม่${q?' “'+esc(inp.value.trim())+'”':''}</div>`;
    box.style.display='block'};
  inp.addEventListener('input',()=>{hid.value='';$('np').style.display='none';draw();checkDup()});
  inp.addEventListener('focus',draw);
  box.addEventListener('mousedown',e=>{const o=e.target.closest('.opt');if(!o)return;e.preventDefault();
    if(o.dataset.p==='__new'){hid.value='__new';$('np').style.display='block';box.style.display='none';
      const raw=inp.value.trim();
      if(/^\d{4,}$/.test(raw))$('nhn').value=raw;else if(/^0\d[\d\-\s]*$/.test(raw))$('nph').value=raw;else $('nnm').value=raw;
      inp.value='＋ คนไข้ใหม่';checkNewDup();return}
    if(o.dataset.b==='1'){alert('คนไข้รายนี้มีนัดในวันที่เลือกแล้ว');return}
    const p=pt(o.dataset.p);hid.value=p.id;inp.value=(p.hn||'—')+' — '+p.name;box.style.display='none';$('np').style.display='none';checkDup()});
  document.addEventListener('mousedown',e=>{if(!e.target.closest('.ac-wrap')&&box)box.style.display='none'});
  ['nhn','nph','nnm'].forEach(k=>$(k).addEventListener('input',checkNewDup));checkDup()}
function checkDup(){const hid=$('fpid'),msg=$('fpmsg');if(!hid||!msg)return;
  if(!hid.value||hid.value==='__new'){msg.textContent='';return}
  const date=$('fd').value,ex=DB.appointments.find(a=>a.patientId===hid.value&&a.date===date&&a.status!=='cancelled');
  msg.innerHTML=ex?`<span style="color:var(--dng);font-weight:700">⚠ มีนัดวันที่ ${thDate(date)} แล้ว (${ex.time||SESSIONS.find(s=>s.id===ex.session).name})</span>`:''}
function checkNewDup(){const w=$('nwarn');if(!w)return;
  const hn=$('nhn').value.trim().toLowerCase(),ph=digits($('nph').value);
  const d=(hn&&DB.patients.find(p=>(p.hn||'').trim().toLowerCase()===hn))||(ph.length>=9&&DB.patients.find(p=>digits(p.phone)===ph));
  w.innerHTML=d?`<div class="warn">⚠ มีคนไข้นี้แล้ว: <b>${esc(d.hn)} — ${esc(d.name)}</b><br>
    <button class="btn sm" style="margin-top:6px" data-act="usePt" data-id="${d.id}">ใช้ข้อมูลคนไข้เดิม</button></div>`:''}
function mPatient(id){const p=id?pt(id):{id:'',hn:'',name:'',age:'',sex:'',phone:'',cat:'อื่นๆ',tags:[],note:''};
  open(`<div class="mtitle">${id?'แก้ไขข้อมูลคนไข้':'เพิ่มคนไข้ใหม่'}</div><div style="height:12px"></div>
   <div class="g2"><div class="f"><label>HN</label><input id="phn" value="${esc(p.hn)}"></div>
   <div class="f"><label>ชื่อ-สกุล</label><input id="pnm" value="${esc(p.name)}"></div></div>
   <div class="g3"><div class="f"><label>อายุ</label><input id="pag" type="number" value="${p.age||''}"></div>
   <div class="f"><label>เพศ</label><select id="psx"><option></option><option ${p.sex==='ช'?'selected':''}>ช</option><option ${p.sex==='ญ'?'selected':''}>ญ</option></select></div>
   <div class="f"><label>เบอร์โทร</label><input id="pph" value="${esc(p.phone)}"></div></div>
   <div class="f"><label>ประเภทเคส</label><select id="pcat">${(DB.categories||[]).map(c=>`<option ${p.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
   <div class="f"><label>โรคประจำตัว / แพ้ยา (คั่นด้วย ,)</label><input id="ptg" value="${esc((p.tags||[]).join(', '))}"></div>
   <div class="f"><label>หมายเหตุทางคลินิก</label><textarea id="pnt" rows="3">${esc(p.note)}</textarea></div>
   <div class="row sp"><button class="btn" data-act="close">ยกเลิก</button>
   <button class="btn pri" data-act="savePatient" data-id="${id||''}">บันทึก</button></div>`)}
function mVisit(id){const v=DB.visits.find(x=>x.id===id),p=pt(v.patientId);
  open(`<div class="mtitle">บันทึกการรักษา</div>
   <div class="muted" style="margin-bottom:13px">${esc(p.hn||'—')} — ${esc(p.name)} · ${thDate(v.date)}</div>
   ${(p.tags||[]).length?`<div class="warn">⚠ ${esc(p.tags.join(' · '))}</div>`:''}
   <div class="g2"><div class="f"><label>หัตถการ</label><input id="vpr" list="procList2" value="${esc(v.proc)}">
     <datalist id="procList2">${PROCS.map(x=>`<option>${x}</option>`).join('')}</datalist></div>
   <div class="f"><label>ซี่ฟัน</label><input id="vto" value="${esc(v.tooth)}"></div></div>
   <div class="f"><label>Diagnosis</label><input id="vd" value="${esc(v.dx)}"></div>
   <div class="f"><label>Treatment plan / นัดครั้งถัดไป</label><input id="vt" value="${esc(v.tx)}"></div>
   <div class="f"><label>บันทึกเพิ่มเติม</label><textarea id="vn" rows="4">${esc(v.note)}</textarea></div>
   <div class="row sp"><button class="btn dg" data-act="delVisit" data-id="${id}">ลบ Visit</button>
   <div class="row"><button class="btn" data-act="close">ปิด</button>
   <button class="btn pri" data-act="saveVisit" data-id="${id}">บันทึก</button></div></div>`)}

/* ---------- ACTIONS ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(!e.target.closest('#tpanel'))$('tpanel').classList.remove('on');return}
  const a=t.dataset.act,id=t.dataset.id,d=t.dataset.d,P=S.plan;
  if(!['themeBtn','setTheme','export','import','logout'].includes(a))$('tpanel').classList.remove('on');
  switch(a){
    case'themeBtn':renderThemePanel();$('tpanel').classList.toggle('on');break;
    case'setTheme':applyTheme(id);save();renderThemePanel();break;
    case'export':{const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
      const u=URL.createObjectURL(b),el=document.createElement('a');
      el.href=u;el.download=`dental-tracker-${TODAY}.json`;el.click();URL.revokeObjectURL(u);break}
    case'import':$('fileIn').click();break;
    case'restoreBk':if(confirm('กู้คืนข้อมูลกลับไปเป็นสแนปช็อตนี้?'))restoreBackup(id);break;
    case'logout':if(SYNC.sb){SYNC.sb.auth.signOut().then(()=>location.reload())}break;
    case'nav':S.view=t.dataset.v;location.hash=t.dataset.v;render();window.scrollTo(0,0);break;
    case'mode':S.mode=t.dataset.m;render();break;
    case'filt':S.filter=t.dataset.f;render();break;
    case'busy':S.onlyBusy=t.dataset.v==='1';render();break;
    case'mv':S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()+ +t.dataset.n,1);render();break;
    case'today':{
      S.cur=new Date(now.getFullYear(),now.getMonth(),1);S.view='schedule';S.filter='all';render();
      setTimeout(()=>{let el=$('d-'+TODAY)||document.querySelector('.cell.tdy');
        if(!el&&S.mode==='list'){S.onlyBusy=false;render();el=$('d-'+TODAY)}
        el&&el.scrollIntoView({behavior:'smooth',block:'center'})},90);break}
    case'openDay':S.view='schedule';S.mode='list';S.onlyBusy=false;render();
      setTimeout(()=>$('d-'+d)?.scrollIntoView({behavior:'smooth',block:'center'}),80);break;
    case'pickDay':P.sel.has(d)?P.sel.delete(d):P.sel.add(d);t.classList.toggle('pk');refreshPlan();break;
    case'planMode':P.mode=t.dataset.m;render();break;
    case'dow':{const i=+t.dataset.i;P.dows.has(i)?P.dows.delete(i):P.dows.add(i);t.classList.toggle('on');break}
    case'applyDow':{if(!P.dows.size){alert('เลือกวันในสัปดาห์ก่อน');return}
      const y=S.cur.getFullYear(),m=S.cur.getMonth(),last=new Date(y,m+1,0).getDate();
      for(let i=1;i<=last;i++){const dt=new Date(y,m,i);if(!P.dows.has(dt.getDay()))continue;
        const occ=Math.floor((i-1)/7);
        if(P.every==='w13'&&!(occ===0||occ===2))continue;
        if(P.every==='w24'&&!(occ===1||occ===3))continue;P.sel.add(iso(dt))}
      render();break}
    case'clearSel':P.sel=new Set();render();break;
    case'savePlan':{const ds=[...P.sel];if(!ds.length){alert('ยังไม่ได้เลือกวัน');return}
      if(P.mode==='clear'){if(!confirm(`ล้างการตั้งค่าห้อง ${ds.length} วัน?`))return;ds.forEach(x=>delete DB.daySchedules[x])}
      else{const ty=P.mode==='off'?'off':P.typeId,w=wt(ty);
        ds.forEach(x=>{DB.daySchedules[x]={typeId:ty,room:w.room,note:P.note};
          DB.appointments.filter(ap=>ap.date===x).forEach(ap=>{ap.typeId=ty;ap.room=w.room})})}
      P.sel=new Set();save();alert(`บันทึก ${ds.length} วันเรียบร้อย`);render();break}
    case'daySet':mDaySet(d);break;
    case'saveDay':{const r=document.querySelector('input[name=wtr]:checked');if(!r){alert('เลือกห้องก่อน');return}
      const w=wt(r.value),room=$('rm').value.trim()||w.room;
      DB.daySchedules[d]={typeId:w.id,room,note:$('dn').value.trim()};
      DB.appointments.filter(x=>x.date===d).forEach(x=>{x.typeId=w.id;x.room=room});
      save();close();render();break}
    case'clearDay':delete DB.daySchedules[d];save();close();render();break;
    case'addAppt':{if(isOff(d||TODAY)&&!confirm('วันนี้ตั้งเป็น OFF — ยืนยันลงนัด?'))return;
      mAppt(null,{d:d||TODAY,s:t.dataset.s,p:t.dataset.p});break}
    case'editAppt':mAppt(id);break;
    case'delAppt':if(confirm('ลบนัดนี้?')){DB.appointments=DB.appointments.filter(x=>x.id!==id);save();render()}break;
    case'usePt':{const p=pt(id);$('fpid').value=p.id;$('fpq').value=(p.hn||'—')+' — '+p.name;
      $('np').style.display='none';$('nwarn').innerHTML='';checkDup();break}
    case'saveAppt':{let pid=$('fpid').value;
      if(pid==='__new'){const hn=$('nhn').value.trim(),ph=$('nph').value.trim(),nm=$('nnm').value.trim();
        if(!nm){alert('กรอกชื่อคนไข้');return}
        const dup=DB.patients.find(p=>(hn&&(p.hn||'').trim().toLowerCase()===hn.toLowerCase())||(digits(ph).length>=9&&digits(p.phone)===digits(ph)));
        if(dup){alert(`มีคนไข้นี้แล้ว: ${dup.hn} — ${dup.name}`);return}
        const np={id:uid('p_'),hn,name:nm,age:'',sex:$('nsx').value,phone:ph,cat:$('ncat').value,tags:[],note:'',createdAt:TODAY};
        DB.patients.push(np);pid=np.id}
      if(!pid){alert('กรุณาค้นหาและเลือกคนไข้ก่อน');return}
      const date=$('fd').value,tm=$('ftm').value,sesId=tm?ses4(tm):'pm';
      const clash=DB.appointments.find(x=>x.patientId===pid&&x.date===date&&x.status!=='cancelled'&&x.id!==id);
      if(clash&&!confirm('คนไข้มีนัดวันนี้แล้ว — เพิ่มอีกนัด?'))return;
      const ty=$('ft').value,w=wt(ty),cur=daySch(date),room=cur&&cur.typeId===ty?cur.room:w.room;
      DB.daySchedules[date]={typeId:ty,room,note:cur?cur.note:''};
      DB.appointments.filter(x=>x.date===date).forEach(x=>{x.typeId=ty;x.room=room});
      const o={patientId:pid,date,session:sesId,typeId:ty,room,proc:$('fpr').value,
        time:tm,duration:+$('fdu').value||30,tooth:$('fto').value.trim(),status:$('fst').value,note:$('fnt').value};
      if(id)Object.assign(DB.appointments.find(x=>x.id===id),o);else DB.appointments.push({id:uid('a_'),visitId:null,...o});
      save();close();render();break}
    case'checkin':{const ap=DB.appointments.find(x=>x.id===id);
      if(ap.visitId){close();mVisit(ap.visitId);break}
      const v={id:uid('v_'),patientId:ap.patientId,apptId:ap.id,date:ap.date,session:ap.session,typeId:ap.typeId,
        proc:ap.proc||'',tooth:ap.tooth||'',dx:'',tx:'',note:ap.note||''};
      DB.visits.push(v);ap.visitId=v.id;ap.status='done';save();close();mVisit(v.id);break}
    case'editVisit':mVisit(id);break;
    case'saveVisit':{const v=DB.visits.find(x=>x.id===id);
      v.proc=$('vpr').value;v.tooth=$('vto').value.trim();v.dx=$('vd').value;v.tx=$('vt').value;v.note=$('vn').value;
      save();close();render();break}
    case'delVisit':if(confirm('ลบ Visit นี้?')){const ap=DB.appointments.find(x=>x.visitId===id);
      if(ap){ap.visitId=null;ap.status='scheduled'}
      DB.visits=DB.visits.filter(x=>x.id!==id);save();close();render()}break;
    case'selP':S.sel=id;render();break;
    case'addPatient':mPatient(null);break;
    case'editPatient':mPatient(id);break;
    case'delPatient':if(confirm('ลบคนไข้รายนี้ พร้อมนัดและ visit ทั้งหมด?')){
      DB.patients=DB.patients.filter(p=>p.id!==id);DB.appointments=DB.appointments.filter(a=>a.patientId!==id);
      DB.visits=DB.visits.filter(v=>v.patientId!==id);if(S.sel===id)S.sel=null;save();render()}break;
    case'savePatient':{const o={hn:$('phn').value.trim(),name:$('pnm').value.trim(),age:$('pag').value,sex:$('psx').value,
      phone:$('pph').value.trim(),cat:$('pcat').value,tags:$('ptg').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('pnt').value};
      if(!o.name){alert('กรอกชื่อคนไข้');return}
      const dup=DB.patients.find(p=>p.id!==id&&o.hn&&(p.hn||'').toLowerCase()===o.hn.toLowerCase());
      if(dup&&!confirm(`HN ซ้ำกับ ${dup.name}\nยืนยันบันทึกต่อ?`))return;
      if(id)Object.assign(pt(id),o);else{const np={id:uid('p_'),createdAt:TODAY,...o};DB.patients.push(np);S.sel=np.id;S.view='archive'}
      save();close();render();break}
    case'addWT':DB.workTypes.push({id:uid('w_'),name:'ห้องใหม่',short:'NEW',room:'ห้องใหม่',color:'#0f9b8e',group:'อื่น ๆ'});save();render();break;
    case'delWT':if(confirm('ลบประเภทงานนี้?')){DB.workTypes=DB.workTypes.filter(w=>w.id!==id);save();render()}break;
    case'reset':if(confirm('ล้างข้อมูลทั้งหมดและเริ่มใหม่?')){const th=DB.theme;localStorage.removeItem(KEY);DB=seed();DB.theme=th;save();S.sel=null;render()}break;
    case'close':close();break;
  }});
document.addEventListener('change',e=>{const i=e.target;
  if(i.dataset.wt){const w=wt(i.dataset.wt);w[i.dataset.f]=i.value;save();if(i.dataset.f!=='name')render();return}
  if(i.dataset.plan){S.plan[i.dataset.plan]=i.value;refreshPlan()}});
document.addEventListener('input',e=>{if(e.target.dataset.plan==='note')S.plan.note=e.target.value});
$('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.patients)throw 0;
    DB=j;save();applyTheme(DB.theme||'light');S.sel=null;render();alert('นำเข้าข้อมูลสำเร็จ — '+DB.patients.length+' คนไข้')}
    catch(x){alert('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f);e.target.value=''});
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});

/* ---------- CLOUD SYNC ---------- */
const SYNC={on:false,sb:null,dirty:false,t:null};
const DEVICE=localStorage.getItem('dev_id')||(()=>{const v='d_'+Math.random().toString(36).slice(2,8);localStorage.setItem('dev_id',v);return v})();
function setSync(txt,color){const b=$('syncBadge');if(b){b.textContent=txt;b.style.color=color||'var(--tx2)'}}
function queuePush(){SYNC.dirty=true;clearTimeout(SYNC.t);setSync('⏳ กำลังบันทึก…');SYNC.t=setTimeout(cloudPush,700)}
async function cloudPush(){if(!navigator.onLine){setSync('⚠ ออฟไลน์','var(--wrn)');return}
  const {error}=await SYNC.sb.from('clinic_state').upsert({id:ROW_ID,data:DB,updated_at:new Date().toISOString(),updated_by:DEVICE});
  if(error){setSync('⚠ ซิงก์ไม่สำเร็จ','var(--dng)');console.warn(error)}else{SYNC.dirty=false;setSync('✓ ซิงก์แล้ว','var(--ok)')}}
async function cloudPull(){const {data,error}=await SYNC.sb.from('clinic_state').select('data').eq('id',ROW_ID).maybeSingle();
  if(error){setSync('⚠ ดึงข้อมูลไม่ได้','var(--dng)');return}
  if(data?.data?.patients){DB=data.data;localSave()}else await cloudPush()}
function subscribeRealtime(){SYNC.sb.channel('clinic-sync').on('postgres_changes',
  {event:'*',schema:'public',table:'clinic_state',filter:`id=eq.${ROW_ID}`},p=>{
    const n=p.new;if(!n||n.updated_by===DEVICE)return;
    DB=n.data;localSave();applyTheme(DB.theme);render();setSync('✓ อัปเดตจากเครื่องอื่น','var(--ok)')}).subscribe()}
window.addEventListener('online',()=>{if(SYNC.dirty)cloudPush()});
function loginUI(msg){
  app.innerHTML=`<div style="max-width:380px;margin:12vh auto"><div class="card">
    <div class="mtitle">เข้าสู่ระบบ</div><div class="muted" style="margin-bottom:16px">ใช้บัญชีที่สร้างไว้ใน Supabase</div>
    ${msg?`<div class="warn">${msg}</div>`:''}
    <div class="f"><label>อีเมล</label><input id="lgE" type="email" autocomplete="username"></div>
    <div class="f"><label>รหัสผ่าน</label><input id="lgP" type="password" autocomplete="current-password"></div>
    <button class="btn pri blk" id="lgB">เข้าสู่ระบบ</button></div></div>`;
  const go=async()=>{const {error}=await SYNC.sb.auth.signInWithPassword({email:$('lgE').value.trim(),password:$('lgP').value});
    error?loginUI('อีเมลหรือรหัสผ่านไม่ถูกต้อง'):boot()};
  $('lgB').onclick=go;$('lgP').onkeydown=e=>{if(e.key==='Enter')go()}}
async function boot(){
  const h=(location.hash||'').replace('#','');
  if(['schedule','planner','upcoming','archive','settings'].includes(h))S.view=h;
  if(!SUPA_URL||!SUPA_KEY){setSync('● เครื่องนี้');render();return}
  SYNC.sb=supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data:{session}}=await SYNC.sb.auth.getSession();
  if(!session){setSync('🔒 ยังไม่เข้าสู่ระบบ');loginUI();return}
  SYNC.on=true;setSync('⏳ กำลังดึงข้อมูล…');
  await cloudPull();applyTheme(DB.theme||'light');render();subscribeRealtime();setSync('✓ ซิงก์แล้ว','var(--ok)')}
boot();

/* ---------- PWA ---------- */
const bar=$('pwaBar'),pmsg=$('pwaMsg'),okBtn=$('pwaBtn'),xBtn=$('pwaX');
const showBar=(text,label,fn)=>{pmsg.textContent=text;okBtn.textContent=label;okBtn.onclick=fn;bar.classList.add('on')};
xBtn.onclick=()=>bar.classList.remove('on');
if('serviceWorker' in navigator){window.addEventListener('load',async()=>{
  try{const reg=await navigator.serviceWorker.register('./sw.js');
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)
        showBar('มีเวอร์ชันใหม่พร้อมใช้งาน','อัปเดต',()=>nw.postMessage('SKIP_WAITING'))})});
    let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;location.reload()});
    setInterval(()=>reg.update(),30*60*1000)}catch(e){console.warn('SW',e)}})}
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
  showBar('ติดตั้งเป็นแอปบนเครื่องนี้?','ติดตั้ง',async()=>{bar.classList.remove('on');deferred.prompt();await deferred.userChoice;deferred=null})});
window.addEventListener('appinstalled',()=>{bar.classList.remove('on');deferred=null});
window.addEventListener('offline',()=>showBar('ออฟไลน์ — ข้อมูลเก็บในเครื่องไว้ก่อน','เข้าใจแล้ว',()=>bar.classList.remove('on')));
</script>
</body>
