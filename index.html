<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Dental Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a2a6e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dental Tracker">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="hd">
  <div class="brand"><div class="ic">DT</div>
    <div><h1>DENTAL TRACKER</h1><p>ระบบนัดหมายและประวัติคนไข้ทันตกรรม</p></div></div>
  <nav id="nav">
    <button data-act="nav" data-v="schedule" class="on">Calendar</button>
    <button data-act="nav" data-v="planner">Planner</button>
    <button data-act="nav" data-v="more">More</button>
    <button data-act="nav" data-v="archive" title="ทะเบียนคนไข้ / ค้นหาคนไข้" aria-label="ทะเบียนคนไข้"><svg class="ics" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M10.5 3a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15zm0 3a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM15.6 17.7l2.1-2.1 4.6 4.6-2.1 2.1z"/></svg></button>
  </nav>
  <div class="hright">
    <span id="syncBadge"><b></b>เครื่องนี้</span>
    <button class="ico" id="bellBtn" data-act="bell" aria-label="แจ้งเตือน" title="แจ้งเตือน"><svg class="ics" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a1.5 1.5 0 0 1 1.5 1.5v.7a6.5 6.5 0 0 1 5 6.3V15l2 2.5v1h-17v-1l2-2.5v-4.5a6.5 6.5 0 0 1 5-6.3v-.7A1.5 1.5 0 0 1 12 2zM9.5 19.5h5a2.5 2.5 0 0 1-5 0z"/></svg><i class="bdot"></i></button>
    <button class="ico" data-act="nav" data-v="settings" aria-label="ตั้งค่า"><svg class="ics" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19.71 8.92 L22.30 9.48 L22.30 14.52 L19.71 15.08 L19.63 15.27 L21.06 17.50 L17.50 21.06 L15.27 19.63 L15.08 19.71 L14.52 22.30 L9.48 22.30 L8.92 19.71 L8.73 19.63 L6.50 21.06 L2.94 17.50 L4.37 15.27 L4.29 15.08 L1.70 14.52 L1.70 9.48 L4.29 8.92 L4.37 8.73 L2.94 6.50 L6.50 2.94 L8.73 4.37 L8.92 4.29 L9.48 1.70 L14.52 1.70 L15.08 4.29 L15.27 4.37 L17.50 2.94 L21.06 6.50 L19.63 8.73Z M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z"/></svg></button>
  </div>
</div></header>
<div class="tpanel" id="tpanel"></div>
<div class="tpanel" id="npanel"></div>
<div class="app" id="app"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<div id="pwaBar"><span id="pwaMsg"></span><button id="pwaBtn">ตกลง</button><button id="pwaX" aria-label="ปิด"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>

<!-- โหลดตามลำดับนี้เท่านั้น ห้ามสลับ -->
<script src="js/config.js"></script>
<script src="js/themes.js"></script>
<script src="js/data.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
